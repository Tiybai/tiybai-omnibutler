[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tiybai-omnibutler"
version = "0.10.3"
description = "Tiybai OmniButler - an open smart-device bridge that lets AI agents (Muse, OpenClaw, Hermes) control smart devices via MCP."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Tiybai OmniButler Contributors" }]
keywords = ["smart-home", "iot", "mcp", "home-assistant", "ai-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "cryptography>=41.0"]
miio = ["cryptography>=41.0"]
tuya = ["tinytuya>=1.13"]
# python-broadlink 1.0 requires Python >= 3.13 and upstream removed
# every older release from PyPI, so on 3.11/3.12 the marker below
# skips it (install succeeds; the Broadlink driver then reports
# itself unavailable like any other missing optional dependency).
broadlink = ["python-broadlink>=1.0; python_version >= '3.13'"]
midea = ["msmart-ng"]
matter = ["websockets>=12.0"]
zigbee = ["paho-mqtt>=1.6"]
homeassistant = ["websockets>=12.0"]
# Every driver extra at once (the union of the driver extras above,
# spelled out so resolvers do not need self-referential extras).
all = [
    "cryptography>=41.0",
    "tinytuya>=1.13",
    "python-broadlink>=1.0; python_version >= '3.13'",
    "msmart-ng",
    "websockets>=12.0",
    "paho-mqtt>=1.6",
]

[project.urls]
Homepage = "https://github.com/Tiybai/tiybai-omnibutler"
Repository = "https://github.com/Tiybai/tiybai-omnibutler"
Issues = "https://github.com/Tiybai/tiybai-omnibutler/issues"
Changelog = "https://github.com/Tiybai/tiybai-omnibutler/releases"

# Third-party drivers register in the "omnibutler.drivers" entry-point group (see docs/drivers-third-party.md); this package declares none itself.
[project.scripts]
tob = "omnibutler.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["omnibutler"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
# Bare `pytest --cov` measures the same thing CI gates on. The floor
# itself (fail-under) is set in the CI test step, not here, so local
# partial runs (a single test file) do not fail spuriously.
source = ["omnibutler"]

[tool.ruff]
# The codebase wraps most lines well under this; 100 leaves room for the
# long bilingual (zh/en) message strings without churn.
line-length = 100

[tool.ruff.lint]
# A deliberately small, high-signal rule set. Families like BLE/DTZ/TRY/S
# are NOT selected: this codebase intentionally swallows-and-logs errors
# on robustness paths and uses local-time semantics in the scene engine,
# so those families would flag design decisions, not defects.
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# Codes annotated in the source for conventions outside this rule set
# (stdlib callback naming, e.g. BaseHTTPRequestHandler do_GET methods).
# Listing them here keeps RUF100 from stripping those explanations.
external = ["A002", "ANN001", "N802"]
ignore = [
    # Bilingual project: Chinese UI strings correctly use fullwidth
    # punctuation (，。：（）), which the ambiguous-unicode rules flag.
    # Rewriting them to ASCII would corrupt the Chinese copy.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# These session tests deliberately assert that *some* exception escapes
# (the contract under test is "fails loudly", not a specific type).
"tests/test_sessions.py" = ["B017"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
