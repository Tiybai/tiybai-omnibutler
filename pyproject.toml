[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tiybai-omnibutler"
version = "0.1.0"
description = "Tiybai OmniButler - an open smart-device bridge that lets AI agents (Muse, OpenClaw, Hermes) control smart devices via MCP."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Tiybai OmniButler Contributors" }]
keywords = ["smart-home", "iot", "mcp", "home-assistant", "ai-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Home Automation",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
tob = "omnibutler.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["omnibutler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
