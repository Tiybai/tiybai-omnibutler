name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Tests
        run: python -m pytest -q
      - name: Secret scan (filenames)
        run: |
          if git ls-files | grep -Ei '(token|secret|\.env)' | grep -v '.gitignore'; then
            echo "possible secret file tracked by git" && exit 1
          fi
      - name: CLI smoke
        run: |
          tob devices
          tob scenes
          tob simulate
