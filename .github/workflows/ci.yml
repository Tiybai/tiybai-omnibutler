name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Tests
        run: python -m pytest -q
      - name: Secret scan (filenames)
        run: |
          if git ls-files | grep -Ei '(token|secret|\.env)' | grep -v '.gitignore'; then
            echo "possible secret file tracked by git" && exit 1
          fi
      - name: CLI smoke
        run: |
          tob devices
          tob scenes
          tob simulate

  secrets:
    # Real secret scanning over content AND history (gitleaks), not
    # just filenames. The OSS binary is downloaded directly because
    # the gitleaks GitHub Action requires a paid license for
    # organization accounts. Config: .gitleaks.toml (default rules +
    # pinned allowlist for known test fixtures).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
      - name: Gitleaks scan
        run: ./gitleaks git --redact --no-banner .

  licenses:
    # Dependency license gate: permissive + file-level weak copyleft
    # only; GPL family or unknown licenses fail (scripts/check_licenses.py,
    # policy in docs/license-audit.md).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with all extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[miio,tuya,broadlink,midea,matter,zigbee]" pip-licenses
      - name: License gate
        run: python scripts/check_licenses.py
